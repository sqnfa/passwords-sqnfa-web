<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Password policies · Vanilla JavaScript</title>
    <style>
      body {
        font: 16px/1.6 system-ui;
        background: #f3f5f9;
        color: #19243c;
        margin: 0;
      }
      main {
        max-width: 36rem;
        margin: 4rem auto;
        padding: 2rem;
        background: white;
        border-radius: 1rem;
      }
      label,
      input:not([type='checkbox']),
      button {
        display: block;
        box-sizing: border-box;
        width: 100%;
      }
      input:not([type='checkbox']),
      button {
        padding: 0.8rem;
        margin: 0.5rem 0 1rem;
        font: inherit;
      }
      button {
        background: #273fa5;
        color: white;
        border: 0;
        border-radius: 0.4rem;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      pre {
        white-space: pre-wrap;
        font-size: 0.85rem;
      }
    </style>
    <script src="../build/passwords-sqnfa-web.min.js" defer></script>
    <script src="./vanilla.js" defer></script>
  </head>
  <body>
    <main>
      <p>Vanilla JavaScript sample</p>
      <h1>Check a password</h1>
      <p>
        Use a passphrase of at least 15 characters. This demo validates locally
        and does not create an account.
      </p>
      <p>
        Unicode characters are normalized to NFC. Use a password manager for
        consistent entry across devices.
      </p>
      <form id="password-form">
        <label for="email">Email address</label>
        <input id="email" type="email" autocomplete="email" required />
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          autocomplete="new-password"
          autocapitalize="none"
          spellcheck="false"
          required
        />
        <button id="show-password" type="button" aria-pressed="false">
          Show password
        </button>
        <label
          ><input id="breach-check" type="checkbox" /> Check Pwned Passwords
          (sends the first five characters of a SHA-1 hash to the
          service)</label
        >
        <button id="submit" type="submit">Validate password</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <p id="guidance"></p>
      <pre id="details"></pre>
    </main>
  </body>
</html>
