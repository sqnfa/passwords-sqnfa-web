name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (run this workflow from the same tag)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-releases
  cancel-in-progress: false
  queue: max

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/release/validate.mjs
      - run: npm ci
      - run: npm run check
      - run: npm ci --prefix examples/angular
      - run: npm run build:angular
      - run: npx playwright install --with-deps chromium
      - run: npm run test:examples
      - run: npm audit
      - run: npm audit --prefix examples/angular

  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global npm@12.2.0
      - run: node scripts/release/validate.mjs
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/package-smoke.mjs
      - run: node scripts/release/publish.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
